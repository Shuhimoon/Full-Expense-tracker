services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fulljizhang
      POSTGRES_USER: fulljizhang
      POSTGRES_PASSWORD: fulljizhang
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulljizhang -d fulljizhang"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://fulljizhang:fulljizhang@postgres:5432/fulljizhang?sslmode=disable
      LISTEN_ADDR: :8080
      COOKIE_SECURE: "false"
    extra_hosts:
      - "postgres:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    extra_hosts:
      - "api:host-gateway"
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
