name: full_jizhang
description: "Full 記帳 — on-device ledger."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.1.0
  google_fonts: 8.2.1
  fl_chart: ^1.2.0
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39
  sqlite3: ^2.9.3
  path_provider: ^2.1.5
  path: ^1.9.1
  decimal: ^3.2.4
  uuid: ^4.5.1
  http: ^1.5.0
  local_auth: ^2.3.0
  share_plus: ^11.0.0
  file_picker: ^10.3.3
  shared_preferences: ^2.5.3
  # fulljizhang://add from Shortcuts, including links delivered while running.
  app_links: ^6.4.1
  # sha256 import key when the URL has no `id` (amount+merchant+time+card_last4).
  # Also PBKDF2-HMAC-SHA256 for the on-device lock. The password is never stored.
  crypto: ^3.0.6
  # Keystore / Keychain for {algo, iterations, salt, hash}, the wrong-attempt
  # counter, and the Face ID flag. Plaintext passwords are not written here.
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.3
  build_runner: ^2.7.1

flutter:
  uses-material-design: true
