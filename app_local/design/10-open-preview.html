<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"/><meta name="viewport" content="width=390"/><title>預覽開帳</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"/><style>
*{margin:0;box-sizing:border-box}
html,body{width:390px;height:844px;overflow:hidden;font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1C1C1E;background:#F2EFE8}
body{position:relative}
.bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(52px);opacity:.45}
.b1{width:280px;height:280px;background:#E8D5C4;top:-60px;left:-80px}
.b2{width:240px;height:240px;background:#B8C9C0;top:280px;right:-90px}
.b3{width:260px;height:260px;background:#D4C4B0;bottom:80px;left:20px}
.phone{position:relative;z-index:1;height:100%;padding:0 14px 0;display:flex;flex-direction:column}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px 8px;font-size:15px;font-weight:600;flex-shrink:0}
.status .r{font-size:12px;font-weight:500;letter-spacing:.4px;opacity:.85}
:root{--sand:#FFFCFA;--sage:#8FB09F;--sage-d:#5F8574}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin:0 2px 18px}
.sheet{position:relative;flex:1;min-height:0;z-index:2;filter:drop-shadow(0 10px 22px rgba(60,40,20,.08))}
.sheet-body{height:100%;overflow:hidden;border-radius:28px;background:var(--sand);border:1px solid rgba(255,255,255,.55);padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.nav{display:flex;align-items:center;gap:8px;padding:2px 0 4px}
.back{width:32px;height:32px;border-radius:10px;border:0;background:rgba(143,176,159,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.nav .title{flex:1;min-width:0}
.nav h1{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.nav .step{font-size:11px;font-weight:500;color:#8E8E93;margin-top:2px}
.dots{display:flex;gap:6px;padding:2px 0 4px}
.dot{height:4px;flex:1;border-radius:2px;background:rgba(143,176,159,.22)}
.dot.on{background:var(--sage-d)}
.card{border-radius:16px;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.03);box-shadow:0 4px 14px rgba(60,40,20,.04);padding:12px 14px}
.sec{font-size:13px;font-weight:600;margin-bottom:8px}
.foot{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:8px}
.cta{height:50px;border-radius:14px;border:0;background:var(--sage-d);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.cta.ghost{background:rgba(143,176,159,.14);color:var(--sage-d)}
.hi{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);z-index:6}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0}
.sum-row+.sum-row{border-top:.5px solid rgba(60,60,67,.1)}
.sum-row .k{font-size:13px;color:#8E8E93;font-weight:500}
.sum-row .v{font-size:14px;font-weight:600}
.sum-row.big .v{font-size:20px;font-weight:700;letter-spacing:-.5px;color:var(--sage-d)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:rgba(143,176,159,.12);border:1px solid rgba(143,176,159,.22)}
.note img{flex-shrink:0;margin-top:1px}
.note p{font-size:12px;line-height:1.45;color:var(--sage-d);font-weight:500}
.mini{display:block;font-size:12px;color:#8E8E93;margin-top:2px;font-weight:400}
</style></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><div class="phone"><div class="status"><span>9:41</span><span class="r">●●●● Wi‑Fi ▮</span></div><div class="stage"><div class="sheet"><div class="sheet-body"><div class="nav"><button type="button" class="back" aria-label="返回"><img src="https://api.iconify.design/material-symbols/arrow-back-ios-new-rounded.svg?color=%235F8574&height=16" width="16" height="16" alt=""/></button><div class="title"><h1>預覽開帳</h1><div class="step">步驟 4／4 · 開帳</div></div></div><div class="dots"><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div></div><div class="card"><div class="sec">開帳摘要</div><div class="sum-row"><span class="k">開帳日</span><span class="v">2026-09-04</span></div><div class="sum-row"><span class="k">現金帳戶</span><span class="v">3 戶 · NT$486,420</span></div><div class="sum-row"><span class="k">現倉</span><span class="v">3 檔 · 成本 NT$748,500</span></div><div class="sum-row big"><span class="k">預覽淨資產</span><span class="v">NT$1,234,920</span></div></div><div class="note"><img src="https://api.iconify.design/material-symbols/info-outline-rounded.svg?color=%235F8574&height=20" width="20" height="20" alt=""/><p>確認數字無誤後儲存開帳。<span class="mini">之後的記帳與分析會以此為起點。</span></p></div><div class="foot"><button type="button" class="cta ghost">返回修改</button><button type="button" class="cta">儲存開帳</button></div></div></div></div><div class="hi"></div></div></body></html>
