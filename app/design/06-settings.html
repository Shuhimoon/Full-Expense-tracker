*{margin:0;box-sizing:border-box}

body{position:relative}

.blob{position:absolute;border-radius:50%;filter:blur(52px);opacity:.45}
.b1{width:280px;height:280px;background:#E8D5C4;top:-60px;left:-80px}
.b2{width:240px;height:240px;background:#B8C9C0;top:280px;right:-90px}
.b3{width:260px;height:260px;background:#D4C4B0;bottom:80px;left:20px}
.phone{position:relative;z-index:1;height:100%;padding:0 14px 0;display:flex;flex-direction:column}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 10px 8px;font-size:15px;font-weight:600;flex-shrink:0}

:root{--sand:#FFFCFA;--dock:#FFFCFA;--sage:#8FB09F;--sage-d:#5F8574}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin:0 2px}
.sheet{position:relative;flex:1;min-height:0;z-index:2;filter:drop-shadow(0 10px 22px rgba(60,40,20,.08))}
.sheet-body{height:100%;overflow:hidden;border-radius:28px 28px 32px 32px;background:var(--sand);border:1px solid rgba(255,255,255,.55);padding:8px 14px 48px;display:flex;flex-direction:column;gap:10px;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 2px}
.topbar h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
.group{border-radius:16px;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.03);box-shadow:0 4px 14px rgba(60,40,20,.04);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 14px;min-height:52px}
.row+.row{border-top:.5px solid rgba(60,60,67,.1)}
.ico{width:32px;height:32px;border-radius:9px;background:rgba(143,176,159,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.meta{flex:1;min-width:0}
.name{font-size:15px;font-weight:600}
.sub{font-size:12px;color:#8E8E93;margin-top:2px;font-weight:500}
.chev{opacity:.35;flex-shrink:0}
.danger .name{color:#8B1A3A;font-weight:600}
.danger .ico{background:rgba(139,26,58,.1)}
.hint{font-size:11px;color:#8E8E93;padding:0 4px;line-height:1.4}
.fab{position:absolute;right:12px;bottom:12px;z-index:6;width:44px;height:44px;border-radius:50%;border:0;background:#F2EFE8;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.dock-zone{position:relative;flex-shrink:0;height:88px;margin-top:4px;z-index:3}
.dock{position:absolute;left:0;right:0;bottom:19px;height:64px;border-radius:32px;background:var(--dock);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 20px rgba(60,40,20,.06)}
.bridge{position:absolute;left:0;top:-9px;width:32px;height:14px;transform:translateX(var(--bx, 16px));transition:transform .55s cubic-bezier(.34,1.25,.48,1);pointer-events:none;z-index:4}
.bridge svg{display:block;width:32px;height:14px;overflow:visible}
.icons{position:absolute;left:0;right:0;bottom:27px;z-index:5;display:flex;align-items:center;justify-content:center;padding:0 26px;pointer-events:none}
.icons-inner{display:flex;align-items:center;justify-content:space-between;width:268px;height:44px;pointer-events:auto}
.tab{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;padding:0;transition:transform .35s cubic-bezier(.34,1.2,.48,1)}
.tab img{opacity:.45;transition:opacity .35s ease;pointer-events:none}
.tab.on img{opacity:1}.tab.on{transform:translateY(-1px)}
.hi{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);z-index:6}
</style></head><body data-tab="3" data-freeze><div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div><div class="phone"><div class="status"><span>9:41</span><span class="r">●●●● Wi‑Fi ▮</span></div><div class="stage"><div class="sheet"><div class="sheet-body"><div class="topbar"><h1>設定</h1></div>

</div>

<script>
(function(){
var foot=document.getElementById('foot');
var tabs=[].slice.call(document.querySelectorAll('.tab'));
var BW=32;
function select(i){
i=((i%4)+4)%4;
var tab=tabs[i];
var zone=foot.getBoundingClientRect();
var r=tab.getBoundingClientRect();
var cx=r.left+r.width/2-zone.left;
foot.style.setProperty('--bx', Math.round(cx-BW/2)+'px');
tabs.forEach(function(t,j){
var on=j===i;
t.classList.toggle('on', on);
var img=t.querySelector('img');
if(img) img.src=img.src.replace(/color=%23[0-9A-Fa-f]+/,'color='+(on?'%235F8574':'%238E8E93'));
});
}
tabs.forEach(function(t){ t.addEventListener('click', function(){ select(+t.dataset.i); }); });
var start = +(document.body.getAttribute('data-tab')||3);
select(start);
})();
</script></body></html>
